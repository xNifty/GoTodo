          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Tasks]
      summary: Delete a task (returns undo_token)
      description: |
        When the task has subtasks, pass mode=cascade (default) to delete them too,
        or mode=reparent with new_parent_id (0 or omit to promote to root) to move
        children before deleting the parent.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [cascade, reparent]
            default: cascade
        - name: new_parent_id
          in: query
          schema:
            type: integer
          description: Target root task id when mode=reparent; 0 or omit promotes children to root
      responses:
        "200":
          description: Deleted with undo token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
