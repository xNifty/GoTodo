components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: API key from profile, bootstrap, or device auth
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: httpOnly session cookie from /api/v1/auth/login or register

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource is in a conflicting state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    APIError:
      description: API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable code (e.g. invalid_request)
        message:
          type: string

    OK:
      type: object
      properties:
        ok:
          type: boolean

    Health:
      type: object
      properties:
        version:
          type: string
        api_enabled:
          type: boolean
        redis_ok:
          type: boolean
        mode:
          type: string
          enum: [full, api]

    SiteInfo:
      type: object
      properties:
        site_name:
          type: string
        show_changelog:
          type: boolean
        enable_global_announcement:
          type: boolean
        global_announcement_text:
          type: string
        announcement_dismissed:
          type: boolean
        enable_registration:
          type: boolean
        invite_only:
          type: boolean
        enable_join_requests:
          type: boolean
        meta_description:
          type: string
        github_oauth_configured:
          type: boolean

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        user_name:
          type: string
        timezone:
          type: string
        items_per_page:
          type: integer
        permissions:
          type: array
          items:
            type: string
        digest_enabled:
          type: boolean
        digest_hour:
          type: integer
          minimum: 0
          maximum: 23
        allow_project_invites:
          type: boolean
          description: When false, the user cannot be invited to shared projects
        username_change_available:
          type: boolean
          description: When true, the user may call POST /api/v1/me/username once
        mfa_enabled:
          type: boolean
          description: When true, password login requires a TOTP or recovery code

    MFARequired:
      type: object
      required: [mfa_required]
      properties:
        mfa_required:
          type: boolean
          enum: [true]

    MFAStatus:
      type: object
      properties:
        enabled:
          type: boolean
        recovery_codes_remaining:
          type: integer

    MFASetup:
      type: object
      properties:
        secret:
          type: string
        otpauth_url:
          type: string
          format: uri

    MFACodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit TOTP or a recovery code (XXXXX-XXXXX)

    MFARecoveryCodes:
      type: object
      properties:
        recovery_codes:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: string

    UserSearchHit:
      type: object
      required: [user_name]
      properties:
        user_name:
          type: string

    UserPatch:
      type: object
      properties:
        timezone:
          type: string
        items_per_page:
          type: integer
          enum: [10, 15, 25, 50]
        digest_enabled:
          type: boolean
        digest_hour:
          type: integer
          minimum: 0
          maximum: 23
        allow_project_invites:
          type: boolean

    RegisterRequest:
      type: object
      required: [email, password, confirm_password, user_name]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        confirm_password:
          type: string
        user_name:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]+$'
          description: Unique username; immutable after registration except by admin
        timezone:
          type: string
        invite_token:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, confirm_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
        confirm_password:
          type: string

    APIKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        key_prefix:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    APIKeyCreated:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Plaintext key; shown only once

    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        project_id:
          type: integer
          nullable: true
          description: Null for personal (inbox) tags

    TagCreateBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
        project_id:
          type: integer
          nullable: true
          description: Omit, null, or 0 for a personal tag; a project id for a project tag

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          maxLength: 1000
          description: Optional project details
        workflow_mode:
          type: string
          enum: [classic, kanban]
          description: Opt-in board workflow; classic keeps boolean completed only
        role:
          type: string
          enum: [owner, editor, viewer]
        owner_email:
          type: string
        owner_user_name:
          type: string
        owner_user_id:
          type: integer

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 1000

    ProjectPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 1000
        workflow_mode:
          type: string
          enum: [classic, kanban]
