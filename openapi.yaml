openapi: 3.0.3
info:
  title: Ordryn / GoTodo API
  description: |
    JSON API for Ordryn (GoTodo). Self-host with `GOTODO_MODE=full` (UI + API) or
    `GOTODO_MODE=api` (API only). Redis is required for `/api/v1` authentication,
    rate limiting, and live SSE fan-out.

    Auth: session cookie (SPA login/register) or `Authorization: Bearer <api_key>`.

    Rate limits (per user, Redis token bucket). Reads and writes are independent.
    Bearer API keys: 120 GET/min (~2/sec) and 60 writes/min (~1/sec).
    SPA session cookies use a higher budget (600 GET/min, 240 writes/min) so the
    web UI is not gated by the external API ceiling.
  version: 1.0.0
  license:
    name: See LICENSE in repository

servers:
  - url: /
    description: Same-origin (BASE_PATH may prefix these paths)

tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: API Keys
  - name: Tasks
  - name: Notifications
  - name: Projects
  - name: Tags
  - name: Saved Views
  - name: Device Auth
  - name: GitHub
  - name: Live

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Public health probe
      security: []
      responses:
        "200":
          description: Health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/site:
    get:
      tags: [Health]
      summary: Public site metadata for the SPA shell
      security: []
      responses:
        "200":
          description: Site metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteInfo"

  /api/v1/events:
    get:
      tags: [Live]
      summary: Live task and project updates (Server-Sent Events)
      description: |
        Long-lived `text/event-stream` for the authenticated user. The SPA uses a
        session cookie (`EventSource` cannot send `Authorization` headers).

        Named events:
        - `ready` — stream is open
        - `ping` — keepalive about every 25s
        - `task-update` — JSON invalidation payload (`type`, optional `task_id` /
          `project_id`, `actor_id`, `timestamp`). Clients should refetch the
          current view; the payload does not include task bodies.

        Types include `task.created`, `task.updated`, `task.deleted`,
        `task.reordered`, `project.updated`, and `join.request`.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: ready
                  data: {}

                  event: task-update
                  data: {"type":"task.updated","task_id":42,"project_id":7,"actor_id":3}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created; Set-Cookie session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/join-requests:
    post:
      tags: [Auth]
      summary: Submit a request to join the site
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                message:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Acknowledgement (same message even if already pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated with a session cookie, or MFA challenge (pending cookie only)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/User"
                  - $ref: "#/components/schemas/MFARequired"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Complete MFA login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFACodeRequest"
      responses:
        "200":
          description: Authenticated; Set-Cookie session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Clear session cookie
      security: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"

  /api/v1/auth/username-available:
    get:
      tags: [Auth]
      summary: Check whether a username is available
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                  available:
                    type: boolean
                  valid:
                    type: boolean
                  message:
                    type: string

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, confirm_email]
              properties:
                email:
                  type: string
                  format: email
                confirm_email:
                  type: string
                  format: email
      responses:
        "200":
          description: Request accepted (always returns ok when valid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/reset-password:
    get:
      tags: [Auth]
      summary: Validate a password reset token
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  email:
                    type: string
                    format: email
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Auth]
      summary: Set a new password using a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, token, new_password, confirm_password]
              properties:
                id:
                  type: string
                token:
                  type: string
                new_password:
                  type: string
                  format: password
                confirm_password:
                  type: string
                  format: password
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/device/code:
    post:
      tags: [Device Auth]
      summary: Start device authorization (Android SSO)
      description: |
        Optional `redirect_uri` binds a native deep link (allowlisted `ordryn://auth-complete`)
        to this authorization. After the user approves or denies in the browser, the SPA
        navigates to that URI so the Android app can resume.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                redirect_uri:
                  type: string
                  description: Optional native deep link; must be ordryn://auth-complete
                  example: ordryn://auth-complete
      responses:
        "200":
          description: Device codes issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/device/token:
    post:
      tags: [Device Auth]
      summary: Poll device authorization for API key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code, grant_type]
              properties:
                device_code:
                  type: string
                grant_type:
                  type: string
                  description: Must be urn:ietf:params:oauth:grant-type:device_code
      responses:
        "200":
          description: Approved; returns api_key once
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                  key_prefix:
                    type: string
                  key_name:
                    type: string
        "400":
          description: Pending, denied, expired, or invalid (OAuth-style error body)

  /api/v1/auth/device/status:
    get:
      tags: [Device Auth]
      summary: Look up a pending device authorization by user_code
      security: []
      parameters:
        - name: user_code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device auth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/device/approve:
    post:
      tags: [Device Auth]
      summary: Approve a pending device authorization
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code:
                  type: string
      responses:
        "200":
          description: Approved; includes redirect_uri when the device requested one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDecisionResponse"

  /api/v1/auth/device/deny:
    post:
      tags: [Device Auth]
      summary: Deny a pending device authorization
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code:
                  type: string
      responses:
        "200":
          description: Denied; includes redirect_uri when the device requested one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDecisionResponse"

  /api/v1/me:
    get:
      tags: [Profile]
      summary: Current user profile
      description: |
        Unauthenticated session probes return HTTP 200 with a JSON `null` body
        (not 401), so SPA bootstrap works behind proxies that rewrite 401 to HTML.
        Invalid Bearer tokens still return 401.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Profile, or null when no session
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Profile]
      summary: Update profile fields
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/username:
    post:
      tags: [Profile]
      summary: One-time username claim for migrated accounts
      description: |
        Allowed only when `username_change_available` is true. Sets the username
        and clears the free-change flag. New registrations do not get this flag.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name]
              properties:
                user_name:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: '^[A-Za-z0-9_]+$'
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v1/me/password:
    post:
      tags: [Profile]
      summary: Change password
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/mfa:
    get:
      tags: [Profile]
      summary: MFA status
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Whether MFA is enabled and unused recovery codes remaining
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/mfa/setup:
    post:
      tags: [Profile]
      summary: Start MFA enrollment
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: TOTP secret and otpauth URL (secret stashed on the session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v1/me/mfa/enable:
    post:
      tags: [Profile]
      summary: Confirm TOTP and enable MFA
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFACodeRequest"
      responses:
        "200":
          description: MFA enabled; recovery codes shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFARecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v1/me/mfa/disable:
    post:
      tags: [Profile]
      summary: Disable MFA
      description: Requires a current TOTP code or an unused recovery code.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFACodeRequest"
      responses:
        "200":
          description: MFA disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v1/me/mfa/recovery-codes:
    post:
      tags: [Profile]
      summary: Replace recovery codes
      description: Requires a current TOTP code or an unused recovery code. New codes are shown once.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFACodeRequest"
      responses:
        "200":
          description: New recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFARecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v1/users/search:
    get:
      tags: [Projects]
      summary: Search usernames for project invites
      description: |
        Case-insensitive username prefix match. Excludes the current user, banned
        users, and users who opted out of project invites. Empty `q` or queries
        shorter than 2 characters return `[]`. Does not return emails. Rate limited
        more tightly than other read endpoints.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching usernames
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSearchHit"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/github:
    get:
      tags: [GitHub]
      summary: GitHub connection status for the current user
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [GitHub]
      summary: Disconnect GitHub
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/github/pat:
    post:
      tags: [GitHub]
      summary: Connect GitHub with a personal access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIError"

  /api/v1/me/github/oauth/start:
    get:
      tags: [GitHub]
      summary: Start GitHub OAuth (requires admin-configured OAuth App)
      responses:
        "200":
          description: Authorize URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorize_url:
                    type: string
                  redirect_uri:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/APIError"

  /api/v1/auth/github/callback:
    get:
      tags: [GitHub]
      summary: GitHub OAuth callback (public redirect)
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Redirects to Settings

  /api/v1/webhooks/github:
    post:
      tags: [GitHub]
      summary: GitHub issues webhook (updates linked tasks only; never creates tasks)
      security: []
      parameters:
        - name: X-Ordryn-Webhook-Secret
          in: header
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIError"

  /api/v1/api-keys:
    get:
      tags: [API Keys]
      summary: List active API keys (no plaintext)
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Key metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
    post:
      tags: [API Keys]
      summary: Create or rotate a named API key
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 80
      responses:
        "201":
          description: Key created; plaintext shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/APIError"

  /api/v1/api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [API Keys]
      summary: Rename an API key
      description: Changes only the display name. The secret token is unchanged. Names are unique among the user's active keys (case-insensitive).
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 80
      responses:
        "200":
          description: Updated key metadata (no plaintext)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
        - name: project
          in: query
          schema:
            type: string
          description: Project id, or none/0 for no project
        - name: tag
          in: query
          schema:
            type: string
          description: >
            Tag id when filtering a specific project, or a tag name (or id resolved to name)
            when listing all tasks / inbox.
        - name: due
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: completed
          in: query
          schema:
            type: string
        - name: workflow_claim_scope
          in: query
          schema:
